# See https://domluna.github.io/JuliaFormatter.jl/stable/ for a list of options

# Match the existing style of this codebase, which omits spaces around `=` in
# keyword arguments.
whitespace_in_kwargs = false

# `lib` is auto-generated by `gen/generator.jl`, which does not itself run
# JuliaFormatter.  Formatting it would be undone on the next regeneration.
ignore = ["lib"]
